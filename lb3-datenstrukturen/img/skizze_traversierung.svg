<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 170" width="600" height="319">
<title>Traversierung</title>
<style>
text{font-family:"Segoe UI",Calibri,Arial,sans-serif;font-size:18px;fill:#1f2430}
.mi{text-anchor:middle}.re{text-anchor:end}.m{font-family:Consolas,"Courier New",monospace}.b{font-weight:700}
.s{font-size:14px;fill:#5b6472}.tr{fill:#d64545}.tg{fill:#2f9e57}.tb{fill:#1d4ed8}
.k{fill:#fff;stroke:#1d4ed8;stroke-width:2.5}.k2{fill:#eef2ff;stroke:#1d4ed8;stroke-width:2.5}
.hl{fill:#fdeceb;stroke:#d64545;stroke-width:2.5}.gr{fill:#e9f9ee;stroke:#2f9e57;stroke-width:2.5}
.am{fill:#fff7e6;stroke:#b45309;stroke-width:2.5}.grau{fill:#eef0f4;stroke:#9aa3b2;stroke-width:2}
.ln{fill:none;stroke:#1f2430;stroke-width:2.5}
.pf{fill:none;stroke:#1d4ed8;stroke-width:2.5;marker-end:url(#pf)}
.pfr{fill:none;stroke:#d64545;stroke-width:2.5;marker-end:url(#pfr)}
.pfg{fill:none;stroke:#2f9e57;stroke-width:2.5;marker-end:url(#pfg)}
.gestr{stroke-dasharray:7 6}
</style>
<defs>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="pfr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="pfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e57"/></marker>
</defs><rect x="-10" y="-10" width="320" height="170" fill="#fff"/>

<line class="ln" x1="63" y1="44" x2="42" y2="86"/>
<line class="ln" x1="77" y1="44" x2="98" y2="86"/>
<circle class="k2" cx="70" cy="30" r="16"/><text class="mi" x="70" y="36">B</text>
<circle class="k" cx="35" cy="100" r="16"/><text class="mi" x="35" y="106">A</text>
<circle class="k" cx="105" cy="100" r="16"/><text class="mi" x="105" y="106">C</text>
<text class="s m" x="140" y="36">Pre: B A C</text>
<text class="s m" x="140" y="66">In: A B C</text>
<text class="s m" x="140" y="96">Post: A C B</text>
<text class="s m" x="140" y="126">Level: B A C</text>

</svg>
