<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Koordinatensystem -->
    <line x1="50" y1="350" x2="550" y2="350" stroke="black" stroke-width="2" />
    <line x1="50" y1="350" x2="50" y2="50" stroke="black" stroke-width="2" />
    
    <!-- Achsenbeschriftungen -->
    <text x="300" y="390" font-size="14" text-anchor="middle" font-weight="bold">Durchschnittlicher Bestellwert (€)</text>
    <text x="20" y="200" font-size="14" text-anchor="middle" transform="rotate(-90 20,200)" font-weight="bold">Bestellhäufigkeit (pro Jahr)</text>
    
    <!-- Datenpunkte -->
    <circle cx="100" cy="300" r="4" fill="red" />
    <circle cx="150" cy="250" r="4" fill="red" />
    <circle cx="200" cy="280" r="4" fill="red" />
    <circle cx="250" cy="200" r="4" fill="blue" />
    <circle cx="300" cy="150" r="4" fill="green" />
    <circle cx="350" cy="220" r="4" fill="blue" />
    <circle cx="400" cy="180" r="4" fill="green" />
    <circle cx="450" cy="300" r="4" fill="blue" />
    <circle cx="500" cy="250" r="4" fill="blue" />
    
    <!-- Zentroide nach erster Iteration -->
    <circle cx="150" cy="200" r="8" stroke="red" fill="none" stroke-width="2" />
    <circle cx="150" cy="275" r="8" stroke="red" fill="none" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="150" y1="200" x2="150" y2="275" stroke="red" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <circle cx="350" cy="250" r="8" stroke="blue" fill="none" stroke-width="2" />
    <circle cx="380" cy="240" r="8" stroke="blue" fill="none" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="350" y1="250" x2="380" y2="240" stroke="blue" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <circle cx="400" cy="120" r="8" stroke="green" fill="none" stroke-width="2" />
    <circle cx="350" cy="165" r="8" stroke="green" fill="none" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="400" y1="120" x2="350" y2="165" stroke="green" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
    </defs>
    
    <text x="300" y="30" font-size="16" text-anchor="middle" font-weight="bold">Erste Iteration</text>
</svg>
