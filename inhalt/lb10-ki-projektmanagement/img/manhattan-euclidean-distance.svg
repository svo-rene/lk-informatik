<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Koordinatensystem -->
    <line x1="50" y1="350" x2="450" y2="350" stroke="black" stroke-width="2" />
    <line x1="50" y1="350" x2="50" y2="50" stroke="black" stroke-width="2" />
    
    <!-- Gitterlinien -->
    <g stroke="#cccccc" stroke-dasharray="5,5">
        <line x1="50" y1="50" x2="450" y2="50" />
        <line x1="50" y1="150" x2="450" y2="150" />
        <line x1="50" y1="250" x2="450" y2="250" />
        <line x1="150" y1="50" x2="150" y2="350" />
        <line x1="250" y1="50" x2="250" y2="350" />
        <line x1="350" y1="50" x2="350" y2="350" />
    </g>
    
    <!-- Punkte A und B -->
    <circle cx="100" cy="300" r="5" fill="blue" />
    <text x="90" y="320" font-size="16">A</text>
    <circle cx="400" cy="100" r="5" fill="blue" />
    <text x="410" y="110" font-size="16">B</text>
    
    <!-- Manhattan-Distanz -->
    <path d="M 100 300 L 400 300 L 400 100" stroke="red" stroke-width="3" fill="none" />
    <text x="240" y="320" font-size="14" fill="red">Manhattan-Distanz</text>
    
    <!-- Euklidische Distanz -->
    <line x1="100" y1="300" x2="400" y2="100" stroke="green" stroke-width="3" />
    <text x="130" y="180" font-size="14" fill="green">Euklidische Distanz</text>
    
    <!-- Beschriftungen -->
    <text x="250" y="380" font-size="16" text-anchor="middle">x-Achse</text>
    <text x="20" y="200" font-size="16" text-anchor="middle" transform="rotate(-90 20,200)">y-Achse</text>
    
    <text x="250" y="30" font-size="18" text-anchor="middle" font-weight="bold">Manhattan vs. Euklidische Distanz</text>
</svg>
