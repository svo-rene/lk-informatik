<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Koordinatensystem -->
    <line x1="50" y1="350" x2="550" y2="350" stroke="black" stroke-width="2"/>
    <line x1="50" y1="350" x2="50" y2="50" stroke="black" stroke-width="2"/>
    
    <!-- Achsenbeschriftungen -->
    <text x="300" y="390" text-anchor="middle" font-family="Arial" font-size="14">Merkmal 1</text>
    <text x="20" y="200" text-anchor="middle" font-family="Arial" font-size="14" transform="rotate(-90 20,200)">Merkmal 2</text>
    
    <!-- Datenpunkte -->
    <circle cx="250" cy="250" r="6" fill="#3498db"/>
    <circle cx="200" cy="200" r="6" fill="#e74c3c"/>
    <circle cx="180" cy="280" r="6" fill="#3498db"/>
    <circle cx="280" cy="180" r="6" fill="#e74c3c"/>
    <circle cx="320" cy="260" r="6" fill="#3498db"/>
    <circle cx="350" cy="220" r="6" fill="#e74c3c"/>
    <circle cx="400" cy="240" r="6" fill="#3498db"/>
    <circle cx="450" cy="190" r="6" fill="#e74c3c"/>
    
    <!-- Neuer Datenpunkt -->
    <circle cx="275" cy="230" r="8" fill="#2ecc71" stroke="black" stroke-width="2"/>
    <text x="275" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Neuer Punkt</text>
    
    <!-- k=3 Kreis -->
    <circle cx="275" cy="230" r="60" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="335" y="230" text-anchor="start" font-family="Arial" font-size="12" fill="#34495e">k=3</text>
    
    <!-- k=5 Kreis -->
    <circle cx="275" cy="230" r="90" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="365" y="230" text-anchor="start" font-family="Arial" font-size="12" fill="#7f8c8d">k=5</text>
    
    <!-- Verbindungslinien -->
    <line x1="275" y1="230" x2="250" y2="250" stroke="#34495e" stroke-width="1"/>
    <line x1="275" y1="230" x2="280" y2="180" stroke="#34495e" stroke-width="1"/>
    <line x1="275" y1="230" x2="320" y2="260" stroke="#34495e" stroke-width="1"/>
    
    <!-- Legende -->
    <rect x="460" y="60" width="120" height="90" fill="white" stroke="black"/>
    <text x="470" y="80" font-family="Arial" font-size="14" font-weight="bold">Legende:</text>
    <circle cx="480" cy="100" r="6" fill="#3498db"/>
    <text x="495" y="104" font-family="Arial" font-size="12">Klasse A</text>
    <circle cx="480" cy="120" r="6" fill="#e74c3c"/>
    <text x="495" y="124" font-family="Arial" font-size="12">Klasse B</text>
    <circle cx="480" cy="140" r="6" fill="#2ecc71"/>
    <text x="495" y="144" font-family="Arial" font-size="12">Neuer Punkt</text>
    
    <!-- Erklärungstext -->
    <text x="70" y="40" font-family="Arial" font-size="16" font-weight="bold">k-Nächste-Nachbarn (k-NN) Algorithmus</text>
    <text x="70" y="70" font-family="Arial" font-size="14">1. Berechne Abstände zum neuen Punkt</text>
    <text x="70" y="90" font-family="Arial" font-size="14">2. Wähle die k nächsten Nachbarn</text>
    <text x="70" y="110" font-family="Arial" font-size="14">3. Klassifiziere durch Mehrheitsentscheidung</text>
</svg>
