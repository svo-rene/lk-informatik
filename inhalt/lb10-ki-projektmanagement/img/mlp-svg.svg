<svg width="650" height="430" viewBox="0 0 650 430" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>

    <text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Mehrschichtiges neuronales Netz (Multi-Layer-Perceptron)</text>

    <!-- Verbindungen Eingabe -> versteckte Schicht -->
    <g stroke="#b0b0b0" stroke-width="1">
        <line x1="130" y1="90" x2="340" y2="60"/>
        <line x1="130" y1="90" x2="340" y2="125"/>
        <line x1="130" y1="90" x2="340" y2="190"/>
        <line x1="130" y1="90" x2="340" y2="255"/>
        <line x1="130" y1="90" x2="340" y2="320"/>
        <line x1="130" y1="90" x2="340" y2="365"/>

        <line x1="130" y1="170" x2="340" y2="60"/>
        <line x1="130" y1="170" x2="340" y2="125"/>
        <line x1="130" y1="170" x2="340" y2="190"/>
        <line x1="130" y1="170" x2="340" y2="255"/>
        <line x1="130" y1="170" x2="340" y2="320"/>
        <line x1="130" y1="170" x2="340" y2="365"/>

        <line x1="130" y1="250" x2="340" y2="60"/>
        <line x1="130" y1="250" x2="340" y2="125"/>
        <line x1="130" y1="250" x2="340" y2="190"/>
        <line x1="130" y1="250" x2="340" y2="255"/>
        <line x1="130" y1="250" x2="340" y2="320"/>
        <line x1="130" y1="250" x2="340" y2="365"/>

        <line x1="130" y1="330" x2="340" y2="60"/>
        <line x1="130" y1="330" x2="340" y2="125"/>
        <line x1="130" y1="330" x2="340" y2="190"/>
        <line x1="130" y1="330" x2="340" y2="255"/>
        <line x1="130" y1="330" x2="340" y2="320"/>
        <line x1="130" y1="330" x2="340" y2="365"/>
    </g>

    <!-- Verbindungen versteckte Schicht -> Ausgabe -->
    <g stroke="#b0b0b0" stroke-width="1">
        <line x1="340" y1="60" x2="550" y2="150"/>
        <line x1="340" y1="60" x2="550" y2="255"/>
        <line x1="340" y1="60" x2="550" y2="330"/>

        <line x1="340" y1="125" x2="550" y2="150"/>
        <line x1="340" y1="125" x2="550" y2="255"/>
        <line x1="340" y1="125" x2="550" y2="330"/>

        <line x1="340" y1="190" x2="550" y2="150"/>
        <line x1="340" y1="190" x2="550" y2="255"/>
        <line x1="340" y1="190" x2="550" y2="330"/>

        <line x1="340" y1="255" x2="550" y2="150"/>
        <line x1="340" y1="255" x2="550" y2="255"/>
        <line x1="340" y1="255" x2="550" y2="330"/>

        <line x1="340" y1="320" x2="550" y2="150"/>
        <line x1="340" y1="320" x2="550" y2="255"/>
        <line x1="340" y1="320" x2="550" y2="330"/>

        <line x1="340" y1="365" x2="550" y2="150"/>
        <line x1="340" y1="365" x2="550" y2="255"/>
        <line x1="340" y1="365" x2="550" y2="330"/>
    </g>

    <!-- Eingabeschicht (4 Neuronen) -->
    <circle cx="130" cy="90" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="130" cy="170" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="130" cy="250" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="130" cy="330" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Versteckte Schicht (6 Neuronen) -->
    <circle cx="340" cy="60" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="340" cy="125" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="340" cy="190" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="340" cy="255" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="340" cy="320" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="340" cy="365" r="16" fill="#9b59b6" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Ausgabeschicht (3 Neuronen) -->
    <circle cx="550" cy="150" r="16" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="550" cy="255" r="16" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="550" cy="330" r="16" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Beschriftungen -->
    <text x="130" y="405" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Eingabeschicht</text>
    <text x="340" y="405" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Versteckte Schicht</text>
    <text x="550" y="405" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Ausgabeschicht</text>
</svg>
