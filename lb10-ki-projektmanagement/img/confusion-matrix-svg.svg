<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect x="100" y="100" width="200" height="200" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="100" x2="200" y2="300" stroke="#000000" stroke-width="2"/>
  
  <rect x="100" y="100" width="100" height="100" fill="#aed6f1" opacity="0.6"/>
  <rect x="200" y="200" width="100" height="100" fill="#aed6f1" opacity="0.6"/>
  <rect x="200" y="100" width="100" height="100" fill="#f5b7b1" opacity="0.6"/>
  <rect x="100" y="200" width="100" height="100" fill="#f5b7b1" opacity="0.6"/>
  
  <text x="150" y="160" font-family="Arial" font-size="16" text-anchor="middle">TP (300)</text>
  <text x="250" y="160" font-family="Arial" font-size="16" text-anchor="middle">FP (50)</text>
  <text x="150" y="260" font-family="Arial" font-size="16" text-anchor="middle">FN (100)</text>
  <text x="250" y="260" font-family="Arial" font-size="16" text-anchor="middle">TN (550)</text>
  
  <text x="100" y="230" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90 50,250)">Tatsächlicher Wert</text>
  <text x="200" y="320" font-family="Arial" font-size="14" text-anchor="middle">Vorhergesagter Wert</text>
  
  <text x="150" y="90" font-family="Arial" font-size="14" text-anchor="middle">Positiv</text>
  <text x="250" y="90" font-family="Arial" font-size="14" text-anchor="middle">Negativ</text>
  <text x="90" y="150" font-family="Arial" font-size="14" text-anchor="end">Positiv</text>
  <text x="90" y="250" font-family="Arial" font-size="14" text-anchor="end">Negativ</text>
</svg>
